name: bootstrap-transfer

on:
  push:
    branches: ["feat/w-section-app"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  restore-project:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/w-section-app
      - name: Reconstruct project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/chunk1 .transfer/chunk2 .transfer/chunk3 .transfer/chunk4 .transfer/chunk5 > /tmp/project.tar.gz.b64
          base64 -d /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .transfer .github/workflows/bootstrap-transfer.yml .github/workflows/ci.yml
      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore GPT-3 steel verification application"
          git push origin HEAD:feat/w-section-app
